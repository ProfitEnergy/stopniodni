name: Kopia indeksu gazu TGEgasDA (TGE)

on:
  schedule:
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/rdng.py'
      - '.github/workflows/rdng.yml'
  workflow_dispatch:
    inputs:
      pelna:
        description: 'Pobierz całą historię od 2023-01-01'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rdng
  cancel-in-progress: false

jobs:
  rdng:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz indeks TGEgasDA
        run: python scripts/rdng.py ${{ github.event.inputs.pelna == 'true' && '--pelna' || '' }}
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane/rdng
          if git diff --cached --quiet; then
            echo "Bez zmian."
          else
            git commit -m "Indeks TGEgasDA $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q || true
            git push
          fi
