name: Aktualizacja danych IMGW

on:
  schedule:
    # IMGW publikuje dane synoptyczne ok. 5. dnia roboczego miesiąca – sprawdzamy 8. i 15.
    - cron: '17 6 8,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz i przelicz dane IMGW-PIB
        run: python scripts/aktualizuj.py
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane/stopniodni
          if git diff --cached --quiet; then
            echo "Brak nowych danych."
          else
            git commit -m "Aktualizacja danych IMGW-PIB $(date +%Y-%m-%d)"
            git push
            for f in dane/stopniodni/*.json; do curl -s "https://purge.jsdelivr.net/gh/ProfitEnergy/stopniodni@main/$f" > /dev/null || true; done
          fi
