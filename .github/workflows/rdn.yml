name: Kopia cen RDN (PSE)

on:
  schedule:
    # co godzinę; ceny na jutro PSE publikuje ok. 13:40–14:15 czasu polskiego
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/rdn.py'
      - '.github/workflows/rdn.yml'
  workflow_dispatch:
    inputs:
      pelna:
        description: 'Pobierz całą historię od 2024-06-14'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rdn
  cancel-in-progress: false

jobs:
  rdn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz ceny RDN z API PSE
        run: python scripts/rdn.py ${{ github.event.inputs.pelna == 'true' && '--pelna' || '' }}
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane/rdn
          if git diff --cached --quiet; then
            echo "Bez zmian."
          else
            git commit -m "Ceny RDN (PSE) $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q || true
            git push
          fi
